on:
  pull_request:
    types: [opened]
  push:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  default:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macOS-latest
          - os: windows-latest
          - os: ubuntu-latest
            container:
              image: ubuntu:18.04
            extrasetup: |
              apt-get update -qqq
              apt-get install -y curl build-essential sudo
    steps:
      - uses: actions/checkout@v1
      - name: Extra setup
        shell: bash
        run: ${{ matrix.extrasetup }}
      - uses: ./
      - run: nim -v
      - run: nimble -v
      - name: Test
        run: nim c -r sample.nim

  # Check for tags missing from nightlies.txt
  missing_binary_tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - run: ./getnightlies.sh

  # Compile a list of versions to test with in the next step  
  matrix_prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-nim-versions.outputs.MATRIX }}
    steps:
      - uses: actions/checkout@v1
      - id: set-nim-versions
        run: |
          cat > script.py <<EOF
          import io
          import json
          # Nim publishes Apple Silicon builds starting with 2.0. Older
          # versions (and their csources) only target Intel macOS, so they
          # run on GitHub's last Intel image instead.
          ARM = 'macos-latest'
          INTEL = 'macos-15-intel'
          versions = [
            ('stable', ARM),
            ('binary:stable', ARM),
            ('2.0', ARM),
            ('binary:2.0', ARM),
            ('1.6', INTEL),
            ('binary:1.6', INTEL),
            ('1.4.0', INTEL),
            ('nightly:https://github.com/nim-lang/nightlies/releases/tag/2025-05-13-version-2-2-9cfc3399bc9b7538941ba59803c998cc8fc7a653', ARM),
            ('sourcetar:https://github.com/nim-lang/nightlies/releases/download/latest-version-1-4/source.tar.xz', INTEL),
            ('release:1.2.8', INTEL),
            ('git:f7145dd26efeeeb6eeae6fff649db244d81b212d', ARM),
            ('git:v1.4.8', INTEL),
            ('git:v1.6.10', INTEL),
            ('git:f7145dd26efeeeb6eeae6fff649db244d81b212d https://github.com/iffy/Nim.git', ARM),
            ('0.20.0', INTEL),
          ]
          with io.open('nightlies.txt', 'r') as fh:
            to_pick = {}
            for line in fh:
              if 'https' in line:
                ver = line.split()[0]
                (maj, min, bug) = ver.split('.')
                # get the latest MAJ.MIN.X version
                to_pick[(maj,min)] = ver
            for (maj, min), ver in to_pick.items():
              tag = 'binary:' + ver
              if tag not in [v for v, _ in versions]:
                versions.append((tag, ARM if int(maj) >= 2 else INTEL))
          skip_linux = {
            'git:v1.4.8',
            'sourcetar:https://github.com/nim-lang/nightlies/releases/download/latest-version-1-4/source.tar.xz',
          }
          include = []
          for nim, mac in versions:
            if nim not in skip_linux:
              include.append({'os': 'ubuntu-latest', 'nim': nim})
            include.append({'os': mac, 'nim': nim})
            include.append({'os': 'windows-latest', 'nim': nim})
          print("MATRIX=" + json.dumps({'include': include}))
          EOF
          python script.py >> $GITHUB_OUTPUT
      - run: echo '${{ steps.set-nim-versions.outputs.MATRIX }}'

  specific:
    needs:
      - matrix_prep
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v1
      - uses: ./
        with:
          version: ${{ matrix.nim }}
      - run: nim -v
      - run: nimble -v
      - name: Test
        run: nim c -r sample.nim
      - name: Install sample project
        shell: bash
        run: |
          set -xe
          cd .github/workflows/sampleproj
          pwd
          nimble install --verbose -y
          ls -al
      - name: Check sample project path
        shell: bash
        run: |
          set -xe
          nimble path sampleproj
      - name: Run installed executable
        shell: bash
        run: |
          set -xe
          echo $PATH
          hello
          
  